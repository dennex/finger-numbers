<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#157a6e">
    <title>Kids Games</title>
    <link rel="stylesheet" href="styles.css?v=41">
  </head>
  <body>
    <main class="home-shell">
      <section class="home-hero">
        <p class="eyebrow">Kids Games</p>
        <h1>Choose a game</h1>
      </section>

      <section class="game-grid" aria-label="Available games">
        <a class="game-link subtraction" href="subtraction/">
          <span class="game-art" aria-hidden="true"></span>
          <span class="game-title">Treasure Rescue</span>
          <span class="game-copy">Practice subtraction up to 6 digits.</span>
        </a>

        <a class="game-link fingers" href="fingers/">
          <span class="game-art" aria-hidden="true"></span>
          <span class="game-title">Finger Numbers</span>
          <span class="game-copy">Learn numbers from 0 to 10 with fingers.</span>
        </a>
      </section>
    </main>

    <script>
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
