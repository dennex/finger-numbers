<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#157a6e">
    <title>Treasure Rescue Subtraction</title>
    <link rel="manifest" href="manifest.webmanifest?v=42">
    <link rel="stylesheet" href="styles.css?v=42">
  </head>
  <body>
    <main class="game-shell">
      <section class="top-bar" aria-label="Game controls">
        <div class="brand-block">
          <p class="eyebrow">Subtraction Adventure</p>
          <h1>Treasure Rescue</h1>
        </div>
        <div class="score-board" aria-label="Score">
          <div>
            <span>Gems</span>
            <strong id="gemCount">0</strong>
          </div>
          <div>
            <span>Rescued</span>
            <strong id="rescuedCount">0</strong>
          </div>
        </div>
      </section>

      <section class="map-band" aria-label="Treasure map progress">
        <div class="explorer" aria-hidden="true">
          <span class="hat"></span>
          <span class="face"></span>
          <span class="body"></span>
        </div>
        <div class="path" id="treasurePath" aria-hidden="true"></div>
        <div class="chest" id="treasureChest" aria-hidden="true">
          <span></span>
        </div>
      </section>

      <section class="controls-panel" aria-label="Practice choices">
        <div class="level-picker" role="group" aria-label="Number size">
          <button class="level-button active" type="button" data-digits="2">2 digits</button>
          <button class="level-button" type="button" data-digits="3">3 digits</button>
          <button class="level-button" type="button" data-digits="4">4 digits</button>
          <button class="level-button" type="button" data-digits="5">5 digits</button>
          <button class="level-button" type="button" data-digits="6">6 digits</button>
          <button class="level-button" type="button" data-digits="mix">Mix</button>
        </div>
        <label class="toggle-row">
          <input id="regroupToggle" type="checkbox" checked>
          <span>Include trading</span>
        </label>
      </section>

      <section class="play-area">
        <section class="problem-card" aria-label="Subtraction problem">
          <div class="problem-head">
            <div>
              <p id="roundLabel">Gate 1</p>
              <h2 id="problemTitle">Unlock the treasure gate</h2>
            </div>
            <button class="icon-button" id="newProblemButton" type="button" aria-label="New problem" title="New problem">New</button>
          </div>

          <div class="subtraction-board" id="subtractionBoard" aria-label="Vertical subtraction"></div>

          <div class="answer-actions">
            <button class="secondary-button" id="hintButton" type="button">Hint</button>
            <button class="secondary-button" id="clearButton" type="button">Clear</button>
            <button class="primary-button" id="checkButton" type="button">Open Gate</button>
          </div>
          <p class="feedback" id="feedbackText" aria-live="polite">Type the answer under the line.</p>
        </section>

        <aside class="helper-panel" aria-label="Subtraction helper">
          <div class="buddy">
            <span class="buddy-face" aria-hidden="true"></span>
            <div>
              <p class="eyebrow">Helper</p>
              <h2 id="helperTitle">Start with the ones</h2>
            </div>
          </div>
          <div class="place-lab" id="placeLab" aria-label="Place value trading"></div>
          <div class="reward-case" aria-label="Unlocked rewards">
            <span class="reward unlocked">Map</span>
            <span class="reward">Hat</span>
            <span class="reward">Key</span>
            <span class="reward">Boat</span>
            <span class="reward">Crown</span>
          </div>
        </aside>
      </section>
    </main>

    <div class="sparkle-field" id="sparkleField" aria-hidden="true"></div>
    <div class="treasure-party" id="treasureParty" aria-live="polite" hidden>
      <div class="party-card">
        <p>Awesome job, you got to the treasure...</p>
        <h2>What's inside?</h2>
        <div class="party-chest" id="partyChest" aria-hidden="true">
          <span></span>
        </div>
      </div>
      <div class="fruit-field" id="fruitField" aria-hidden="true"></div>
    </div>
    <script src="app.js?v=42" defer></script>
  </body>
</html>
